name: Conferir site

# A cada envio no lote (e antes de ir para a main), confere os tipos e compila o site como a Vercel compila.
# Se quebrar aqui, não publique: a Vercel manteria a versão anterior no ar, mas o erro já fica visível.
on:
  push:
    branches: [lote, main]
    paths: ["src/**", "scripts/testes/**", "package.json", "package-lock.json", "next.config.*", "tsconfig.json"]
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tudo no painel do Dev (módulos, ajustes, permissões especiais)
        run: node scripts/checar-controle-dev.mjs
      - name: Tipos
        run: npx tsc --noEmit -p .
      - name: Compilar
        run: npx next build
      - name: Telas (abre as páginas num navegador de verdade, celular e computador)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          npx next start -p 3100 > /tmp/site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/termos && break; sleep 1; done
          node scripts/testes/telas.mjs http://localhost:3100 || { tail -40 /tmp/site.log; exit 1; }
